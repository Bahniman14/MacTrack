name: check-price

on:
  schedule:
    # 06:30 UTC = 12:00 IST. GitHub's scheduled runs are best-effort and are
    # often delayed 5-30 minutes (sometimes more) during busy periods.
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      force_summary:
        description: "Send the weekly summary now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mactrack
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A failing test stops the job here; the failure() step below sends Telegram.
      - name: Run tests
        run: python -m pytest -q

      # Dashboard CSV parser/stats tests. Node is preinstalled on ubuntu-latest.
      - name: Run dashboard tests (node)
        run: |
          node --version
          node --test tests/js/csv.test.mjs tests/js/stats.test.mjs

      - name: Check prices
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SUMMARY: ${{ inputs.force_summary && '1' || '0' }}
          CSV: docs/data/prices.csv
        run: |
          before=$( [ -f "$CSV" ] && wc -l < "$CSV" || echo 0 )
          status=0
          python check_price.py || status=$?
          after=$( [ -f "$CSV" ] && wc -l < "$CSV" || echo 0 )
          echo "CSV lines: before=$before after=$after; check_price exit=$status"
          if [ "$after" -le "$before" ]; then
            echo "::error::check_price.py wrote zero rows"
            exit 1
          fi
          # Rows are saved either way; the commit step below still runs on these exit codes.
          # A failed job also makes GitHub email the owner (Settings > Notifications > Actions),
          # which matters when Telegram itself is the thing that is broken.
          case "$status" in
            3) echo "::error::Alert/summary processing crashed (exit 3); price rows were saved" ;;
            4) echo "::error::Telegram delivery failed (exit 4) - check the bot token/chat id secrets; price rows were saved" ;;
          esac
          exit "$status"

      # Runs even if alert processing crashed (exit 3) or Telegram delivery failed (exit 4)
      # so appended rows are never lost, but not when the check step never ran (tests failed).
      - name: Commit price data
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$(git status --porcelain -- docs/data/prices.csv)" ]; then
            echo "prices.csv unchanged; nothing to commit"
            exit 0
          fi
          git config user.name "mactrack-bot"
          git config user.email "mactrack-bot@users.noreply.github.com"
          git add docs/data/prices.csv
          git commit -m "data: price check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2; do
            if git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "push attempt $attempt failed"
            # A conflicted rebase would block the retry; reset it and start over.
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1

      - name: Notify failure on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set; skipping failure notification"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=MacTrack workflow failed: ${RUN_URL}" ) || code="curl-error"
          echo "Telegram notify HTTP status: $code"
